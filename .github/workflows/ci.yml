name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types:
      - upstream-updated

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
          - name: windows-x64
            os: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Report the upstream change
        if: github.event_name == 'repository_dispatch'
        run: echo "Rebuilding after ${{ github.event.client_payload.repository }}@${{ github.event.client_payload.sha }}"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libssl-dev

      - name: Install MSYS2 toolchain
        if: matrix.os == 'windows-2022'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-openssl
            git

      - name: Configure and build (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Configure and build (Windows)
        if: matrix.os == 'windows-2022'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

  notify:
    name: Rebuild Falcon
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04

    steps:
      - name: Dispatch upstream-updated
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "DOWNSTREAM_DISPATCH_TOKEN is not set, skipping Falcon-MC/Falcon"
            exit 0
          fi

          gh api "repos/Falcon-MC/Falcon/dispatches" \
            -f event_type=upstream-updated \
            -f "client_payload[repository]=${{ github.repository }}" \
            -f "client_payload[sha]=${{ github.sha }}"
